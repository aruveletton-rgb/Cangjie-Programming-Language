# Nginx 反代 + 静态托管（Linux 主机用）。
#
# 承担三件事：
#   1. 80 端口给 Let's Encrypt 做验证，其余 301 到 https
#   2. 443 反代到仓颉后端 127.0.0.1:38082（后端自身不监听公网，这是设计约束）
#   3. 托管 Web 演示（可视化 Demo）与隐私政策页，省掉单独的静态托管费用
#
# 替换 <DOMAIN> 后放到 /etc/nginx/conf.d/campus.conf。
# 证书：certbot certonly --webroot -w /var/www/certbot -d <DOMAIN>

server {
    listen 80;
    listen [::]:80;
    server_name <DOMAIN>;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <DOMAIN>;

    ssl_certificate     /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 备案号必须可在页面访问到；放在首页底部由前端渲染，这里只保证页面可达。
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 8m;

    # 后端接口。Host 必须原样透传：后端按 Origin 做白名单校验。
    location /api/ {
        proxy_pass         http://127.0.0.1:38082;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 聊天流式转发（SSE）：关闭缓冲，否则首字会被攒住。
    location = /api/v1/chat {
        proxy_pass         http://127.0.0.1:38082;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass       http://127.0.0.1:38082;
        proxy_set_header Host $host;
        access_log       off;
    }

    # Web 演示（可视化 Demo）。由 src/web-demo 构建后拷入。
    location /app/ {
        alias /opt/ict-cloud/webapp/;
        try_files $uri $uri/ /app/index.html;
    }

    # 隐私政策页：备案与上架都要一个稳定可访问的 URL。
    location = /privacy {
        alias /opt/ict-cloud/webapp/privacy.html;
        default_type text/html;
    }

    location = / {
        return 302 /app/;
    }
}
